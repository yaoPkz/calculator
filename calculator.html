<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>

        <div class="butons">
            <button class="boton operador" onclick="clearDisplay()">AC</button>
            <button class="boton operador" onclick="deleteLast()">DEL</button>
            <button class="boton operador" onclick="appendToDisplay('%')">%</button>
            <button class="boton operador" onclick="appendToDisplay('/')">/</button>

            <button class="boton" onclick="appendToDisplay('7')">7</button>
            <button class="boton" onclick="appendToDisplay('8')">8</button>
            <button class="boton" onclick="appendToDisplay('9')">9</button>
            <button class="boton operador" onclick="appendToDisplay('*')">*</button>

            <button class="boton" onclick="appendToDisplay('4')">4</button>
            <button class="boton" onclick="appendToDisplay('5')">5</button>
            <button class="boton" onclick="appendToDisplay('6')"> 6</button>
            <button class="boton operador" onclick="appendToDisplay('-')">-</button>

            <button class="boton" onclick="appendToDisplay('1')">1</button>
            <button class="boton" onclick="appendToDisplay('2')">2</button>
            <button class="boton" onclick="appendToDisplay('3')">3</button>
            <button class="boton operador" onclick="appendToDisplay('+')">+</button>
            
            <button class="boton" onclick="appendToDisplay('0')">0</button>
            <button class="boton" onclick="appendToDisplay('.')">.</button>
            <button class="boton operador" onclick="calculateResult()">=</button>
        </div>

    </div>
    
    <script src="calculator.js"></script>
</body>
</html>
